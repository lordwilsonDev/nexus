name: factory-gate

# Engineering-hygiene factory gate for NEXUS.
# Every push/PR to main re-runs the pytest suite (4 tests) with a coverage
# gate, mypy, ruff (E9/F/I), and the three offline hygiene experiments. Any
# non-PASS leg fails the job, which blocks the push/merge.
#
# Coverage floor: 60% (raised 2026-08-09 from 30% — the constellation's
# forcing function toward agent-reach's 75% level; measured coverage is
# ~33%, so this leg is RED until tests close the gap).
#
# CI installs what the tests/hygiene runners import: yaml + ollama (config /
# engines), fastapi + uvicorn (api) and rich + prompt-toolkit (cli) for the
# import-surface contract, plus pytest. The heavy voice/whisper deps in
# requirements.txt are runtime-only and are deliberately NOT installed in CI.
# Live-auth is scoped out (serverless gateway) — consistent with suite.json.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    name: factory-gate (tests + cov + types + lint + hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (minimal import-surface + gate tools)
        run: |
          pip install --upgrade pip
          pip install pytest pyyaml ollama fastapi uvicorn rich prompt-toolkit pytest-cov mypy ruff

      - name: Regression suite + coverage gate
        run: pytest --cov=config --cov=router --cov=api --cov=gateway --cov=memory --cov=cli --cov=engines --cov-report=term --cov-fail-under=60 -q

      - name: Typed enforcement (mypy)
        run: mypy --namespace-packages --explicit-package-bases --ignore-missing-imports config.py router.py api.py gateway.py memory.py cli.py engines

      - name: Lint gate (ruff E9/F/I)
        run: ruff check --select E9,F,I .

      - name: Hygiene suite (offline experiments)
        env:
          MSB_REPO: ${{ github.workspace }}
        run: python scripts/hygiene/hygiene_runner.py --all
